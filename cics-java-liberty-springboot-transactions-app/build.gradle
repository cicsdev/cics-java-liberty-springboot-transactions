plugins
{
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'eclipse'
	id 'war'
	id 'idea'
}

group = 'com.ibm.cicsdev.springboot'
version = '0.1.0'

// ============================================================================
// Java Configuration
// ============================================================================
java {
    toolchain
    {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

// ============================================================================
// WAR Configuration
// ============================================================================
war
{
    archiveFileName = 'cics-java-liberty-springboot-transactions.war'
}

// Two versions of the WAR would be built, one for embedding into servers like Liberty (plain)
// and a bootWAR which can run standalone and contains all the Tomcat and Spring Boot stuff
// we don't need bootWAR, so disable it.
bootWar { enabled = false }

// If in Eclipse, add Javadoc to the local project classpath
eclipse
{
    classpath
    {
        downloadJavadoc = true
    }
    wtp
    {
        facet
        {
            facet name: 'jst.web', version: '6.1'
        }
        component
        {
            contextPath = 'cics-java-liberty-springboot-transactions'
        }
    }
}

repositories
{
    mavenCentral()
}


dependencies
{
    // CICS BOM (as of Sept 2024)
    compileOnly enforcedPlatform("com.ibm.cics:com.ibm.cics.ts.bom:${project.property('cics.bom.version')}")

    // Don't include JCICS in the final build (no need for version because we have BOM)
    compileOnly("com.ibm.cics:com.ibm.cics.server")

    // Spring Boot web support
    implementation ("org.springframework.boot:spring-boot-starter-web")
    
    // Exclude only the Tomcat embedded container jars from the WAR — Liberty provides the servlet container.
    // In Spring Boot 4.x, spring-boot-starter-tomcat pulls in spring-boot-starter (and thus all core
    // Spring libraries) as a compile dependency, so using providedRuntime on the full starter would
    // incorrectly exclude spring-core, spring-context etc. from WEB-INF/lib.
    providedRuntime("org.springframework.boot:spring-boot-starter-tomcat-runtime")
  
    // Java Transaction API - don't include in the final build
    compileOnly 'jakarta.transaction:jakarta.transaction-api'
    // Spring Boot Transaction support (includes spring-tx and transaction auto-configuration in Spring Boot 4)
    implementation ("org.springframework.boot:spring-boot-transaction")
}
